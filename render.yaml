services:
  - type: web
    name: loyaltysynth-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 300
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: FLASK_DEBUG
        value: "0"
      - key: LOYALTYSYNTH_SECRET_KEY
        generateValue: true
